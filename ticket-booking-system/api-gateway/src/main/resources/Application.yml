server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Redis (for rate limiting) ────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── Gateway Routes ───────────────────────────────────────────
  cloud:
    gateway:
      routes:

        # ── Booking Service ────────────────────────────────────
        - id: booking-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/events/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # ── Payment Service ────────────────────────────────────
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # ── Cancellation Service ───────────────────────────────
        - id: cancellation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/cancellations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

      # Global CORS config
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.ticketing.gateway: DEBUG
    org.springframework.cloud.gateway: INFO