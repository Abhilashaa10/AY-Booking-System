server:
  port: 8083

spring:
  application:
    name: notification-service

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/ticketdb
    username: ticketuser
    password: ticketpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ticketing.*"
        isolation.level: read_committed

  # ── Mail (use Gmail SMTP or Mailtrap for local testing) ─────
  mail:
    host: smtp.mailtrap.io       # swap with smtp.gmail.com in prod
    port: 587
    username: your_mailtrap_user
    password: your_mailtrap_pass
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── Kafka topic names ────────────────────────────────────────
kafka:
  topics:
    payment-result: payment.result

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.ticketing.notification: DEBUG
    org.springframework.kafka: INFO